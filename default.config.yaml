menuHelpMd: |
  # 👑 Majority Rules — How to Play

  The goal is not to give the "right" answer—it's to pick what the **majority of the room** will choose!

  ---

  ## 🚀 How to Play

  1. **Share the QR code.** Players scan, pick a name, they are in.
  2. **Set the questions.** Write your own, aim them at the room, or let AI generate a set.
  3. **Put the board on the big screen.** The room watches the split land together.
  4. **Pick the pace.** Fast is a warm-up. Slower, with a new room, it is an icebreaker.
  5. **Start playing.** Rounds run about 30 seconds, and it gets better the bigger the room.

  ---

  ## 🎯 How the Game Works

  1. **Read the Question**  
     Each round presents a subjective question with 2 to 3 choices. There are no right or wrong factual answers—only popular ones!

  2. **Pick Your Choice & Set Your Confidence**  
     Choose an option and adjust the **Confidence Slider** before the 30-second timer runs out.

  3. **Reveal & Score**  
     When voting ends, all choices are revealed at once. If your option received the most votes, you win points!

  ---

  ## 🎚️ Confidence Slider & Scoring

  Adjust your slider to balance risk and reward:

  | Confidence Level | Multiplier | Points if Majority (Win) | Points if Minority (Lose) |
  | :--- | :--- | :--- | :--- |
  | **🛡️ Safe (Left)** | 0.5x | **+5 pts** | **0 pts** *(no penalty!)* |
  | **⚖️ Normal (Center)** | 1.0x | **+10 pts** | **-5 pts** |
  | **🔥 Risky (Right)** | 3.0x | **+30 pts** | **-15 pts** |

  ---

  ## 🤝 Tie Handling

  If multiple choices tie for the highest vote count, **all players who voted for any of the tied choices win**, receiving half the normal win points (rounded).

  ---

  ## 💡 Pro Tips

  - **Think like the crowd**: Don't vote for your personal favorite if you know the room loves something else!
  - **Play it Safe early**: Use **Safe (0.5x)** when opinions are split to protect your score from negative penalties.
  - **Go Risky on slam dunks**: If you're confident the whole room will agree, switch to **Risky (3x)** for a huge +30 point boost!
  - **Suggest Topics**: If enabled by the host, submit fun topics in the lobby for the host to turn into live questions.

