hostInfoContentMd: |
  # 🎮 How to Play

  **Majority Rules** is a fast-paced psychological party game where players score points by predicting the majority vote.

  ---

  ## 🚀 How to Play

  1. **Share the QR code.** Players scan, pick a name, they are in.
  2. **Set the questions.** Write your own, aim them at the room, or let AI generate a set.
  3. **Put the board on the big screen.** The room watches the split land together.
  4. **Pick the pace.** Fast is a warm-up. Slower, with a new room, it is an icebreaker.
  5. **Start playing.** Rounds run about 30 seconds, and it gets better the bigger the room.

  ---

  ## 🕹️ Game Flow & Host Controls

  - **Pregame Setup:** Use the **Question Manager** to generate AI questions or create custom questions. Toggle **Player Topics** to let players suggest themes.
  - **Start Game:** Begins the game and moves to the first round.
  - **During Rounds:** Select a question and click **Start Round**. Players get 30 seconds to vote. Click **Reveal Results** to end early or wait for timeout.
  - **Advance Rounds:** Review the results and scores, then click **Next Round**.
  - **End Game:** Click **End Game** at any time to reveal the final winner podium on all screens.

  ---

  ## 📊 Scoring Reference

  | Confidence Level | Win (Majority) | Loss (Minority) |
  | :--- | :--- | :--- |
  | **🛡️ Safe (0.5x)** | **+5 points** | **0 points** (no penalty) |
  | **⚖️ Normal (1x)** | **+10 points** | **-5 points** |
  | **🔥 Risky (3x)** | **+30 points** | **-15 points** |

  ---

  ## 🤝 Special Rules

  - **Ties:** If two or more options tie with the highest vote count, all voters for those options win with half points (+3, +5, +15).
  - **Auto-Submit:** If a player selected an option but didn't submit before the 30-second timer expires, their vote is automatically submitted with 1x Normal confidence.
  - **Player Topics:** When enabled, players can submit custom topic ideas from their waiting screen. You can turn their ideas into AI questions with one click!
