gameLobbyMd: |
  # 👑 Majority Rules

  Predict the crowd. Match the majority. Climb the leaderboard!

  ---

  ## 🎯 Quick Rules

  1. **Vote with the Crowd** — Points are awarded for picking the most popular answer in the room.
  2. **Set Your Confidence** — Choose Safe (+5/0), Normal (+10/-5), or Risky (+30/-15) to manage risk.
  3. **Beat the Clock** — Lock in your vote before the 30-second countdown expires.

  ---

  ## 🏆 Scoring Summary

  | Confidence | When Majority Wins | When in Minority |
  | :--- | :--- | :--- |
  | **🛡️ Safe** | **+5 points** | **0 points** |
  | **⚖️ Normal** | **+10 points** | **-5 points** |
  | **🔥 Risky** | **+30 points** | **-15 points** |

  *Tied majorities share the win at half points!*

